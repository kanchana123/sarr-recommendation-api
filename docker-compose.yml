services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: sarr-api
    ports:
      - "8080:8080"
    env_file:
      - .env.example
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-sarr_pypi}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      RERANK_ENABLED_DEFAULT: ${RERANK_ENABLED_DEFAULT:-false}
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: sarr-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
