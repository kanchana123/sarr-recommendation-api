# Clone → copy .env → docker compose up --build
#
# Default: API talks to Qdrant Cloud (set QDRANT_* in .env).
# Optional local empty Qdrant:
#   QDRANT_URL=http://qdrant:6333 docker compose --profile local-qdrant up --build

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: sarr-api:latest
    container_name: sarr-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      HF_HOME: /cache/huggingface
    volumes:
      - hf_cache:/cache/huggingface
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  qdrant:
    profiles: ["local-qdrant"]
    image: qdrant/qdrant:v1.11.3
    container_name: sarr-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  hf_cache:
  qdrant_data:
