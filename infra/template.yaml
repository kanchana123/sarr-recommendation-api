AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SARR search API — Lambda container behind HTTP API

Globals:
  Function:
    Timeout: 60
    MemorySize: 3008

Parameters:
  QdrantUrl:
    Type: String
    Description: Qdrant Cloud cluster URL
  QdrantApiKey:
    Type: String
    NoEcho: true
    Description: Qdrant Cloud API key
  QdrantCollection:
    Type: String
    Default: sarr
  EmbeddingModel:
    Type: String
    Default: BAAI/bge-small-en-v1.5
  RerankerModel:
    Type: String
    Default: cross-encoder/ms-marco-MiniLM-L-6-v2

Resources:
  SearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures: [x86_64]
      Environment:
        Variables:
          QDRANT_URL: !Ref QdrantUrl
          QDRANT_API_KEY: !Ref QdrantApiKey
          QDRANT_COLLECTION: !Ref QdrantCollection
          EMBEDDING_MODEL: !Ref EmbeddingModel
          RERANKER_MODEL: !Ref RerankerModel
          EMBEDDING_DIM: "384"
          RERANK_ENABLED_DEFAULT: "false"
          HF_HOME: /tmp/huggingface
      Events:
        SearchApi:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        SearchRoot:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
    Metadata:
      DockerTag: sarr-search
      DockerContext: ../
      Dockerfile: docker/Dockerfile.lambda

Outputs:
  ApiUrl:
    Description: Invoke URL for the search API
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
