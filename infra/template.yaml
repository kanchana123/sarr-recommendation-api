AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SARR search API — Lambda container behind HTTP API

Globals:
  Function:
    Timeout: 90
    MemorySize: 3008

Parameters:
  QdrantUrl:
    Type: String
    Description: Qdrant Cloud cluster URL
  QdrantApiKey:
    Type: String
    NoEcho: true
    Description: Qdrant Cloud API key
  QdrantCollection:
    Type: String
    Default: sarr
  EmbeddingModel:
    Type: String
    Default: /var/task/models/bge-small-en-v1.5
    Description: Local path (baked into the image) or Hugging Face id for the bi-encoder
  RerankerModel:
    Type: String
    Default: /var/task/models/ms-marco-MiniLM-L-6-v2
    Description: Local path (baked into the image) or Hugging Face id for the cross-encoder
  GcpProjectId:
    Type: String
    Default: sarr-505305
    Description: GCP project for Vertex AI Gemini (RAG).

Resources:
  SearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures: [x86_64]
      EphemeralStorage:
        Size: 1024
      Environment:
        Variables:
          QDRANT_URL: !Ref QdrantUrl
          QDRANT_API_KEY: !Ref QdrantApiKey
          QDRANT_COLLECTION: !Ref QdrantCollection
          EMBEDDING_MODEL: !Ref EmbeddingModel
          RERANKER_MODEL: !Ref RerankerModel
          EMBEDDING_DIM: "384"
          RERANK_ENABLED_DEFAULT: "false"
          GCP_PROJECT_ID: !Ref GcpProjectId
          GCP_CREDENTIALS_SECRET_ARN: !Sub "${AWS::StackName}/gcp-vertex"
          VERTEX_LOCATION: us-central1
          VERTEX_GEMINI_MODEL: gemini-2.5-flash-lite
          VERTEX_GEMINI_FALLBACK_MODEL: gemini-2.5-flash
          HF_HOME: /tmp/huggingface
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          TORCH_NUM_THREADS: "1"
          CUDA_VISIBLE_DEVICES: ""
          NVIDIA_VISIBLE_DEVICES: "void"
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}/gcp-vertex*"
      Events:
        SearchApi:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        SearchRoot:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
    Metadata:
      DockerTag: sarr-search
      DockerContext: ../
      Dockerfile: docker/Dockerfile.lambda

Outputs:
  ApiUrl:
    Description: Invoke URL for the search API
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
