[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sarr"
version = "0.1.0"
description = "Semantic Artifacts Retrieval and Ranking — PyPI package search API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SARR contributors" }]
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "numpy>=1.26",
]

[project.optional-dependencies]
api = [
  "qdrant-client>=1.9",
  "sentence-transformers>=3.0",
  "torch>=2.2",
  "mangum>=0.17",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
]
etl = [
  "qdrant-client>=1.9",
  "sentence-transformers>=3.0",
  "torch>=2.2",
  "google-cloud-bigquery>=3.20",
  "pandas>=2.2",
  "tqdm>=4.66",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-mock>=3.14",
  "ruff>=0.4",
  "mypy>=1.10",
  "httpx>=0.27",
]
all = ["sarr[api,etl,dev]"]

[project.scripts]
sarr = "sarr.cli:main"
sarr-api = "sarr.api.local:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "unit: fast isolated tests",
  "integration: tests that need external services or docker",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sarr"]
mypy_path = "src"

[tool.coverage.run]
source = ["sarr"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
